<style>
:root{
  --bg:#0a0b0f;--surface:#111318;--surface2:#191c24;--border:#1e2130;
  --acc:#e8c84a;--red:#e84a4a;--grn:#4ae89a;--pur:#9b59b6;
  --txt:#f0f0f0;--txt2:#8a8fa0;--txt3:#3a3f50;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
.header{flex-shrink:0;height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--acc);}
.h-title{font-size:14px;font-weight:700;flex:1;}
.h-sub{font-size:11px;color:var(--txt2);}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--acc);color:#000;}
.btn-secondary{background:var(--surface2);color:var(--txt);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--txt2);}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-icon{padding:4px 7px;font-size:12px;}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:18px;}

/* TATAMI COLUMNS */
.tatami-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start;}

/* TATAMI CARD */
.tatami-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:visible;}
.tc-header{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;border-radius:12px 12px 0 0;}
.tc-num{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:1px;color:var(--txt2);}
.tc-count{font-size:10px;color:var(--txt3);flex:1;}
.tc-header-btns{display:flex;gap:4px;}

/* MATCH ROWS */
.match-row{padding:10px 14px 10px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;position:relative;transition:background .15s;}
.cat-stripe{position:absolute;right:0;top:0;bottom:0;width:5px;}
.row-future{opacity:.62;}
.row-future .drag-handle{opacity:.4;}
.cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;color:#fff;white-space:nowrap;}
.match-row:last-child{border-bottom:none;}
.match-row:hover{background:rgba(255,255,255,.02);}

/* row type colors */
.row-win{background:rgba(74,232,154,.05);}
.row-live{background:rgba(232,200,74,.05);}
.row-susp{background:rgba(155,89,182,.05);}
.row-late{background:rgba(232,200,74,.04);border-right:2px solid rgba(232,200,74,.4);}

/* dot indicators */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-win{background:var(--grn);}
.dot-live{background:var(--acc);animation:blink .8s infinite;}
.dot-up{background:var(--border);}
.dot-susp{background:var(--pur);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

/* row number */
.rnum{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--txt3);min-width:16px;text-align:center;flex-shrink:0;}

/* match info */
.minfo{flex:1;min-width:0;}
.mnames{font-size:12px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:3px;}
.nm-blue{color:#6a9fe0;}.nm-white{color:var(--txt2);}.nm-vs{color:var(--txt3);font-size:10px;}
.nm-unknown{color:var(--txt3);font-size:11px;font-style:italic;}
.mmeta{font-size:10px;color:var(--txt3);margin-top:1px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}

/* badges */
.badge{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;white-space:nowrap;}
.badge-W{background:rgba(232,200,74,.12);color:var(--acc);}
.badge-R{background:rgba(155,89,182,.12);color:#b07fda;}
.badge-F{background:rgba(232,74,74,.15);color:#ff8080;}
.badge-live{background:rgba(232,200,74,.2);color:var(--acc);}
.badge-susp{background:rgba(155,89,182,.2);color:#b07fda;}
.badge-late{background:rgba(232,200,74,.15);color:var(--acc);}
.badge-win{background:rgba(74,232,154,.12);color:var(--grn);}

/* ACTION BUTTONS (appear on hover) */
.row-actions{display:flex;gap:3px;flex-shrink:0;}
.act{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);
  color:var(--txt2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.act:hover{color:var(--txt);border-color:var(--txt2);}
.act.danger:hover{color:var(--red);border-color:rgba(232,74,74,.4);}
.act.warn:hover{color:var(--acc);border-color:rgba(232,200,74,.4);}
.act.purple:hover{color:#b07fda;border-color:rgba(155,89,182,.4);}

/* MODALS */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.ov.h{display:none;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;}
.mh{padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.mt{font-size:15px;font-weight:700;}
.mb{padding:0 16px 16px;}
.mf{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:10px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;}
.fc{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:8px 10px;color:var(--txt);font-family:'Heebo',sans-serif;font-size:13px;outline:none;width:100%;}
.fc:focus{border-color:var(--acc);}
.dv{height:1px;background:var(--border);margin:10px 0;}
.ro{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;margin-bottom:5px;transition:border-color .12s;}
.ro.on{border-color:var(--acc);background:rgba(232,200,74,.05);}
.ro input{accent-color:var(--acc);}

/* suspended countdown badge */
.susp-countdown{font-size:9px;font-weight:700;color:#b07fda;}

/* drag & drop rows */
.up-row{position:relative;}
.drag-handle{cursor:grab;color:var(--txt3);font-size:15px;line-height:1;padding:0 2px;user-select:none;flex-shrink:0;}
.drag-handle:active{cursor:grabbing;}
.up-row.dragging{opacity:.4;}
.up-row.drop-before{box-shadow:inset 0 3px 0 0 var(--accent);}
.up-row.drop-after{box-shadow:inset 0 -3px 0 0 var(--accent);}
/* competitor-edit tabs */
.ce-tab{flex:1;padding:6px 4px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--txt2);font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.ce-tab.on{background:var(--acc);color:#000;border-color:var(--acc);}
.ce-pane .fg{margin-bottom:10px;}
/* category strip */
.cat-bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);}
.cat-chip{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 5px 3px 7px;}
.cc-name{font-size:10px;font-weight:600;color:var(--txt2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cc-count{font-size:9px;color:var(--txt3);background:rgba(255,255,255,.06);border-radius:3px;padding:0 4px;}
.cc-btn{background:none;border:1px solid var(--border);color:var(--txt2);border-radius:4px;font-size:9px;line-height:1;padding:2px 4px;cursor:pointer;}
.cc-btn:hover:not(:disabled){color:#fff;border-color:#4a4f60;}
.cc-btn:disabled{opacity:.25;cursor:default;}
.cc-move{color:#e8c84a;border-color:rgba(232,200,74,.4);}
.cc-edit{color:#6ea8ff;border-color:rgba(110,168,255,.4);}
.cc-solo{font-size:9px;font-weight:700;color:#e8a13f;background:rgba(232,161,63,.15);border:1px solid rgba(232,161,63,.4);border-radius:4px;padding:1px 5px;cursor:help;}

/* empty tatami */
.tc-idle{padding:16px 14px;text-align:center;font-size:11px;color:var(--txt3);}

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<script>
// ═══════════════════════════════════
// STAGE LABELS
// ═══════════════════════════════════
const SL={
  eighth:'שמינית גמר', quarter:'רבע גמר', semi:'חצי גמר', final:'גמר', league:'ליגה',
  rep_eighth:'שמינית ניחומים', rep_quarter:'רבע ניחומים',
  rep_semi:'חצי ניחומים', rep_bronze:'מקום 3', rep_final:'גמר ניחומים',
};
const ST={
  eighth:'W',quarter:'W',semi:'W',final:'F',league:'W',
  rep_eighth:'R',rep_quarter:'R',rep_semi:'R',rep_bronze:'R',rep_final:'R',
};
const sl=s=>SL[s]||s;
const st=s=>ST[s]||'W';
// Distinct color per category — assigned BY POSITION so adjacent categories
// always get different colors (no hash collisions).
const _CAT_PALETTE=['#e8574a','#4a90e8','#3fb56b','#e8a13f','#9b5de5','#e85aa8','#2bb6c4','#c98a3f','#7cb342','#5c6bc0','#d4477e','#26a69a','#8d6e63','#ec407a','#66bb6a','#ab47bc'];
const _catColorMap={};
// For a category: how many matches each competitor appears in (by name).
// Returns array of competitor names who have only ONE planned match.
function soloFighters(catId){
  const cat=(STATE.allCats||[]).find(c=>String(c.id)===String(catId));
  if(!cat) return [];
  const count={};
  (cat.competitors||[]).forEach(cp=>{ count[cp.name]=0; });
  (cat.matches||[]).forEach(m=>{
    if(m.win_reason==='bye') return;
    const bN=cat.competitors?.find(c=>c.id===m.blue_id)?.name;
    const wN=cat.competitors?.find(c=>c.id===m.white_id)?.name;
    if(bN) count[bN]=(count[bN]||0)+1;
    if(wN) count[wN]=(count[wN]||0)+1;
  });
  // only competitors who actually have matches, with exactly 1
  return Object.entries(count).filter(([n,c])=>c===1).map(([n])=>n);
}

function catColor(catId){
  const key=String(catId||'');
  if(_catColorMap[key]!==undefined) return _CAT_PALETTE[_catColorMap[key]];
  // assign the next index based on how many categories we've colored so far
  const idx=Object.keys(_catColorMap).length % _CAT_PALETTE.length;
  _catColorMap[key]=idx;
  return _CAT_PALETTE[idx];
}
// Reset color assignments so order follows the category list each render
function resetCatColors(){
  const ordered=(STATE.allCats||[]).map(c=>c.id);
  Object.keys(_catColorMap).forEach(k=>delete _catColorMap[k]);
  ordered.forEach((id,i)=>{ _catColorMap[String(id)]=i%_CAT_PALETTE.length; });
}

function badge(s){return `<span class="badge badge-${st(s)}">${sl(s)}</span>`;}
function cname(name,role,ref){
  if(name)return{k:true,t:name};
  if(!ref)return{k:false,t:'?'};
  return{k:false,t:`${role==='loser'?'מפסיד':'מנצח'} #${ref}`};
}

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
// Each tatami has a queue of matches
// Each match: {id, blue, white, bRole, bRef, wRole, wRef, category, stage, matchNum, status, susp}
// status: 'live'|'pending'|'done'|'suspended'
// susp: {type:'matches'|'time', n, setAt, remaining} | null

let STATE = {competition:{name:"",tatami_count:3},tatami:[]};

let movingMatchId=null, suspendingMatchId=null;

// ═══════════════════════════════════
// HELPERS
// ═══════════════════════════════════
function findMatch(mid){
  for(const t of STATE.tatami){
    const m=t.matches.find(x=>x.id===mid);
    if(m)return{match:m,tatami:t};
  }
  return null;
}

function matchDisplay(m){
  const b=cname(m.blue,m.bRole,m.bRef);
  const w=cname(m.white,m.wRole,m.wRef);
  return `${b.t} מול ${w.t} · ${sl(m.stage)} · קרב #${m.matchNum}`;
}

// ═══════════════════════════════════
// RENDER
// ═══════════════════════════════════
function render(){
  resetCatColors();
  document.getElementById('tatami-grid').innerHTML=
    STATE.tatami.map(t=>renderTatami(t)).join('');
}

function renderTatami(t){
  // Only show: last winner (green) + live (yellow) + upcoming with players
  const doneList=t.matches.filter(m=>m.status==='done'&&m.win_reason!=='bye');
  const lastDone=doneList.length?doneList[doneList.length-1]:null;
  const liveM=t.matches.find(m=>m.status==='live');
  // Show upcoming matches in the exact queue order the manager set
  // (drag / move / ▲▼ all mutate t.matches directly — respect it, do NOT re-interleave)
  const upcoming=t.matches.filter(m=>
    (m.status==='pending'||m.status==='suspended')&&
    m.win_reason!=='bye'&&
    (m.blue||m.white||m.bRef||m.wRef)   // include future matches (source known, players not yet)
  );
  const nonDone=upcoming;

  let rows='';

  // Last winner row (green)
  if(lastDone){
    const winner=lastDone.winnerName||(lastDone.blue||'?');
    rows+=`<div class="match-row row-win">
      <div class="dot dot-win"></div>
      <div class="minfo">
        <div class="mnames"><span style="color:var(--grn);font-weight:700">✓ ${winner}</span></div>
        <div class="mmeta">${lastDone.category||''} <span class="badge badge-win">הסתיים</span></div>
      </div>
    </div>`;
  }

  // Live row (yellow)
  if(liveM){
    const b=cname(liveM.blue,liveM.bRole,liveM.bRef), w=cname(liveM.white,liveM.wRole,liveM.wRef);
    rows+=`<div class="match-row row-live">
      <div class="dot dot-live"></div>
      <div class="minfo" style="flex:1">
        <div class="mnames">
          <span class="nm-blue">${b.t}</span><span class="nm-vs">מול</span><span class="nm-white">${w.t}</span>
        </div>
        <div class="mmeta">${liveM.category} ${badge(liveM.stage)} · קרב #${liveM.matchNum}
          <span class="badge badge-live">● פעיל</span></div>
      </div>
    </div>`;
  }

  // Upcoming rows
  upcoming.forEach((m,i)=>{
    const b=cname(m.blue,m.bRole,m.bRef), w=cname(m.white,m.wRole,m.wRef);
    const isSusp=m.status==='suspended';
    const _cc=catColor(m.catId);
    const _fut=m.future?' row-future':'';
    rows+=`<div class="match-row up-row ${isSusp?'row-susp':''}${_fut}" id="mr-${m.id}"
        draggable="true"
        data-mid="${m.id}" data-tid="${t.id}"
        ondragstart="dragStart(event)" ondragend="dragEnd(event)"
        ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropRow(event)">
      <div class="cat-stripe" style="background:${_cc}"></div>
      <div class="drag-handle" title="גרור לשינוי סדר">⠿</div>
      <div class="dot ${isSusp?'dot-susp':'dot-up'}"></div>
      <div class="rnum">${i+1}</div>
      <div class="minfo">
        <div class="mnames">
          <span class="${b.k?'nm-blue':'nm-unknown'}">${b.t}</span>
          <span class="nm-vs">מול</span>
          <span class="${w.k?'nm-white':'nm-unknown'}">${w.t}</span>
        </div>
        <div class="mmeta"><span class="cat-tag" style="background:${_cc}">${m.category}</span> ${badge(m.stage)} · קרב #${m.matchNum}
          ${isSusp?'<span class="badge badge-susp">⏸ מושהה</span>':''}</div>
      </div>
      <div class="row-actions">
        <button class="act warn" onclick="openMove('${m.id}')" title="העבר מזרן">↔</button>
        <button class="act purple" onclick="openSuspend('${m.id}')" title="${isSusp?'בטל השהייה':'השהה'}">${isSusp?'▶':'⏸'}</button>
      </div>
    </div>`;
  });

  if(!lastDone&&!liveM&&!upcoming.length){
    rows='<div class="tc-idle">אין קרבות ממתינים</div>';
  }

  const totalLeft=upcoming.length+(liveM?1:0);

  // Category strip: reorder / move whole categories
  const catIds=catOrderOf(t);
  let catBar='';
  if(catIds.length){
    catBar='<div class="cat-bar">'+catIds.map((cid,idx)=>{
      const nm=(t.matches.find(m=>m.catId===cid)||{}).category||'—';
      const cnt=t.matches.filter(m=>m.catId===cid&&m.status!=='done').length;
      const _solo=soloFighters(cid);
      const _soloBadge=_solo.length
        ? `<span class="cc-solo" title="קרב אחד בלבד: ${_solo.join(', ')}">⚠ ${_solo.length}</span>`
        : '';
      return `<div class="cat-chip" style="border-right:4px solid ${catColor(cid)}">
        <span class="cc-name" title="${nm}">${nm}</span>
        <span class="cc-count">${cnt}</span>
        ${_soloBadge}
        <button class="cc-btn" onclick="moveCatOrder(${t.id},'${cid}',-1)" ${idx===0?'disabled':''} title="הקדם קטגוריה">▲</button>
        <button class="cc-btn" onclick="moveCatOrder(${t.id},'${cid}',1)" ${idx===catIds.length-1?'disabled':''} title="אחר קטגוריה">▼</button>
        <button class="cc-btn cc-move" onclick="openCatMove('${cid}','${nm.replace(/'/g,"")}')" title="העבר קטגוריה למזרן אחר">↔</button>
        <button class="cc-btn cc-edit" onclick="openCatEdit('${cid}')" title="ערוך מתחרים">✏️</button>
      </div>`;
    }).join('')+'</div>';
  }

  return `<div class="tatami-card">
    <div class="tc-header">
      <div class="tc-num">מזרן ${t.id}</div>
      <div class="tc-count">${totalLeft} קרבות</div>
      <div class="tc-header-btns">
        <button class="btn btn-secondary btn-sm" onclick="addMatchToTatami(${t.id})" title="הוסף קרב">+</button>
      </div>
    </div>
    ${catBar}
    ${rows}
  </div>`;
}

// ═══════════════════════════════════
// DRAG & DROP — reorder upcoming matches
// ═══════════════════════════════════
let _dragMid=null, _dragTid=null;

function dragStart(e){
  const row=e.target.closest('.up-row');
  if(!row) return;
  _dragMid=row.dataset.mid;
  _dragTid=row.dataset.tid;
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain',_dragMid); }catch(_){}
}
function dragEnd(e){
  document.querySelectorAll('.up-row').forEach(r=>r.classList.remove('dragging','drop-before','drop-after'));
  _dragMid=null; _dragTid=null;
}
function dragOver(e){
  const row=e.target.closest('.up-row');
  if(!row||row.dataset.mid===_dragMid) return;
  if(row.dataset.tid!==_dragTid) return;      // only within the same tatami
  e.preventDefault();
  const rect=row.getBoundingClientRect();
  const after=(e.clientY-rect.top)>rect.height/2;
  row.classList.toggle('drop-after',after);
  row.classList.toggle('drop-before',!after);
}
function dragLeave(e){
  const row=e.target.closest('.up-row');
  if(row) row.classList.remove('drop-before','drop-after');
}
async function dropRow(e){
  const row=e.target.closest('.up-row');
  if(!row||!_dragMid) return;
  e.preventDefault();
  const targetMid=row.dataset.mid;
  const tid=+row.dataset.tid;
  const after=row.classList.contains('drop-after');
  row.classList.remove('drop-before','drop-after');
  if(targetMid===_dragMid) return;

  const t=STATE.tatami.find(x=>x.id===tid);
  if(!t) return;

  // Reorder within the non-done queue, preserving done matches in place
  const queue=t.matches.filter(m=>m.status!=='done');
  const done=t.matches.filter(m=>m.status==='done');
  const from=queue.findIndex(m=>String(m.id)===String(_dragMid));
  let to=queue.findIndex(m=>String(m.id)===String(targetMid));
  if(from<0||to<0) return;
  const [moved]=queue.splice(from,1);
  to=queue.findIndex(m=>String(m.id)===String(targetMid));   // recompute after removal
  const insertAt=after?to+1:to;
  queue.splice(insertAt,0,moved);

  t.matches=[...done,...queue];
  render();
  try{
    await persistQueue(t);
    toast('✓ הסדר עודכן');
  }catch(err){
    console.error('drop persist:',err);
    toast('⚠ שגיאה בשמירת הסדר');
  }
}

// ═══════════════════════════════════
// MOVE MATCH
// ═══════════════════════════════════
function openMove(mid){
  movingMatchId=mid;
  const {match,tatami}=findMatch(mid)||{};
  if(!match)return;
  document.getElementById('move-match-info').textContent=matchDisplay(match);
  // populate tatami options
  const sel=document.getElementById('move-tatami');
  sel.innerHTML=STATE.tatami.map(t=>`<option value="${t.id}"${t.id===tatami.id?' selected':''}>מזרן ${t.id}</option>`).join('');
  // set position to end of target
  document.getElementById('move-pos').value=1;
  document.getElementById('move-ov').classList.remove('h');
}

async function confirmMove(){
  if(!movingMatchId)return;
  const {match,tatami:srcTatami}=findMatch(movingMatchId)||{};
  if(!match)return;
  const dstId=+document.getElementById('move-tatami').value;
  const pos=Math.max(1,+document.getElementById('move-pos').value);
  const dstTatami=STATE.tatami.find(t=>t.id===dstId);
  if(!dstTatami)return;

  // Remove from source
  srcTatami.matches=srcTatami.matches.filter(m=>m.id!==movingMatchId);

  // Insert at position in destination (skip done matches)
  const nonDoneIdx=dstTatami.matches.filter(m=>m.status!=='done').length;
  const insertAt=Math.min(pos-1, nonDoneIdx);
  let count=0,arrayIdx=dstTatami.matches.length;
  for(let i=0;i<dstTatami.matches.length;i++){
    if(dstTatami.matches[i].status==='done')continue;
    if(count===insertAt){arrayIdx=i;break;}
    count++;
  }
  dstTatami.matches.splice(arrayIdx,0,match);

  closeModal('move-ov');
  render();

  // Persist: this single match moves tatami, then renumber both queues
  try{
    await DB.updateMatch(match.dbId,{tatami_id:dstId});
    match.tatamiOverride=dstId;
    await persistQueue(dstTatami);
    if(srcTatami.id!==dstTatami.id) await persistQueue(srcTatami);
    toast('✓ הקרב הועבר למזרן '+dstId);
  }catch(e){
    console.error('move persist:',e);
    toast('⚠ שגיאה בשמירת ההעברה');
  }
}

// Renumber order_in_tatami (1..N) for a tatami queue and save changed rows
async function persistQueue(t){
  let n=0;
  const jobs=[];
  t.matches.forEach(m=>{
    if(m.status==='done') return;
    n++;
    if(m.order!==n){
      m.order=n;
      jobs.push(DB.updateMatch(m.dbId,{order_in_tatami:Math.round(n),tatami_id:t.id}));
    }
  });
  await Promise.all(jobs);
}

function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d27;border:1px solid #2e3348;color:#e8eaf6;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.5)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

// Move an entire category earlier/later in its tatami queue
async function moveCatOrder(tatamiId,catId,dir){
  const t=STATE.tatami.find(x=>x.id===tatamiId);
  if(!t)return;
  const order=catOrderOf(t);              // ['catId1','catId2',...]
  const i=order.indexOf(catId);
  const j=i+dir;
  if(i<0||j<0||j>=order.length) return;
  [order[i],order[j]]=[order[j],order[i]];
  // rebuild queue: done matches first (untouched), then categories in new order
  const done=t.matches.filter(m=>m.status==='done');
  const rest=[];
  order.forEach(cid=>{
    t.matches.filter(m=>m.status!=='done'&&m.catId===cid).forEach(m=>rest.push(m));
  });
  t.matches=[...done,...rest];
  render();
  try{
    await persistQueue(t);
    toast('✓ סדר הקטגוריות עודכן');
  }catch(e){ console.error('cat order:',e); toast('⚠ שגיאה בשמירת הסדר'); }
}

// Categories present on a tatami, in queue order
function catOrderOf(t){
  const seen=[];
  t.matches.forEach(m=>{
    if(m.status==='done')return;
    if(!seen.includes(m.catId)) seen.push(m.catId);
  });
  return seen;
}

// ═══════════════════════════════════
// SUSPEND MATCH
// ═══════════════════════════════════
function openSuspend(mid){
  const {match}=findMatch(mid)||{};
  if(!match)return;

  // If already suspended, un-suspend
  if(match.status==='suspended'){
    match.status='pending';
    match.susp=null;
    render();
    return;
  }

  suspendingMatchId=mid;
  document.getElementById('susp-match-info').textContent=matchDisplay(match);
  document.getElementById('susp-ov').classList.remove('h');
}

function confirmSuspend(){
  if(!suspendingMatchId)return;
  const {match,tatami}=findMatch(suspendingMatchId)||{};
  if(!match)return;

  const type=document.querySelector('input[name="stype"]:checked').value;
  const n=type==='matches'?+document.getElementById('susp-n').value:+document.getElementById('susp-mins').value;

  match.status='suspended';
  match.susp={type,n,remaining:n,setAt:Date.now()};

  // Move suspended match to end of queue (after all pending)
  const idx=tatami.matches.indexOf(match);
  if(idx!==-1){
    tatami.matches.splice(idx,1);
    tatami.matches.push(match);
  }

  closeModal('susp-ov');
  render();

  // If time-based, start countdown
  if(type==='time') startSuspTimer(match,tatami);
}

function startSuspTimer(match,tatami){
  const endTime=Date.now()+match.susp.n*60*1000;
  const iv=setInterval(()=>{
    if(!match.susp||match.status!=='suspended'){clearInterval(iv);return;}
    const rem=Math.ceil((endTime-Date.now())/1000);
    match.susp.remaining=Math.max(0,rem);
    if(rem<=0){
      // bring back to next in queue
      match.status='pending';
      match.susp=null;
      // move to first pending position
      const idx=tatami.matches.indexOf(match);
      if(idx!==-1){
        tatami.matches.splice(idx,1);
        // insert before first pending
        const firstPending=tatami.matches.findIndex(m=>m.status==='pending');
        tatami.matches.splice(firstPending===-1?tatami.matches.length:firstPending,0,match);
      }
      clearInterval(iv);
    }
    render();
  },1000);
}

function tick(){

    if(m.status==='suspended'&&m.susp?.type==='time'){
      const rem=Math.ceil((m.susp.setAt+m.susp.n*60*1000-Date.now())/1000);
      m.susp.remaining=Math.max(0,rem);
    }
  }));
}

// ═══════════════════════════════════
// AUTO-SPREAD — space out each competitor's matches (rest between fights)
// Greedy: at each slot pick the pending match whose competitors rested longest.
// ═══════════════════════════════════
// Split a category's pending matches into rounds — each competitor at most once per round
function _splitRounds(matches){
  const known=matches.filter(m=>m.blue||m.white);
  const future=matches.filter(m=>!m.blue&&!m.white);
  const rounds=[];

  // Known-player matches: each competitor at most once per round
  let pool=known.slice(), guard=0;
  while(pool.length && guard++<200){
    const round=[], used=new Set(), next=[];
    for(const m of pool){
      const a=m.blue, b=m.white;
      if((a!=null&&used.has(a))||(b!=null&&used.has(b))){ next.push(m); }
      else { round.push(m); if(a!=null)used.add(a); if(b!=null)used.add(b); }
    }
    rounds.push(round);
    pool=next;
  }

  // Future matches (players unknown but structure known): pack into rounds so that
  // a match is never in the same round as a match that feeds it. All the players
  // who could reach these matches already fought in earlier rounds, so treating a
  // future round like a normal round spaces them correctly (final + bronze together).
  let fpool=future.slice(); guard=0;
  while(fpool.length && guard++<200){
    const round=[], placed=new Set(), next=[];
    for(const m of fpool){
      const fedByPlaced=(m._feeders||[]).some(f=>placed.has(f));
      if(fedByPlaced){ next.push(m); }
      else { round.push(m); placed.add(m.matchNum); }
    }
    rounds.push(round);
    fpool=next;
  }
  return rounds;
}

// Priority group 0 (goes first each tatami-round): leagues of 3, or any category with 5+ competitors
function _catPriority(nComp, method){
  if(method==='league' && nComp===3) return 0;
  if(nComp>=5) return 0;
  return 1;
}

// Round-based spread across the WHOLE tatami:
// each "tatami round" = one round from every category, priority categories first.
async function autoSpreadTatami(t, save=true){
  const done=t.matches.filter(m=>m.status==='done');
  // Include future matches — _splitRounds knows how to place them by stage/feeder
  const queue=t.matches.filter(m=>m.status!=='done');
  if(queue.length<2){ return; }

  // group pending by category, preserving current order within each
  const byCat={};
  const catOrder=[];
  queue.forEach(m=>{
    if(!byCat[m.catId]){ byCat[m.catId]=[]; catOrder.push(m.catId); }
    byCat[m.catId].push(m);
  });

  // build category descriptors with rounds + priority
  const cats=catOrder.map((cid,idx)=>{
    const catMatches=byCat[cid];
    const catInfo=(STATE.allCats||[]).find(c=>c.id===cid);
    const nComp = catInfo ? (catInfo.competitors?.length||0) : 0;
    const method = catInfo ? catInfo.method : 'knockout';
    return {
      cid, idx,
      rounds:_splitRounds(catMatches),
      ri:0,
      prio:_catPriority(nComp, method),
    };
  });

  // order: priority group first, then original tatami order
  cats.sort((a,b)=> a.prio-b.prio || a.idx-b.idx);

  // interleave one round per category, per tatami-round
  const spread=[];
  let anyLeft=true, guard=0;
  while(anyLeft && guard++<500){
    anyLeft=false;
    for(const c of cats){
      if(c.ri<c.rounds.length){
        c.rounds[c.ri].forEach(m=>spread.push(m));
        c.ri++;
        if(c.ri<c.rounds.length) anyLeft=true;
      }
    }
  }

  t.matches=[...done,...spread];
  if(save) await persistQueue(t);
}

async function autoSpreadAll(){
  if(!confirm('לסדר את כל המזרנים בסיבובי מזרן?\n\nכל קטגוריה נותנת סבב (קרב לכל מתחרה), עוברים לקטגוריה הבאה, וחוזר חלילה. ליגות של 3 וקטגוריות גדולות (5+) מתחילות כל סבב. קרבות שהסתיימו לא יושפעו.')) return;
  toast('⏳ מסדר בסיבובי מזרן...');
  try{
    for(const t of STATE.tatami){ await autoSpreadTatami(t, true); }
    render();
    toast('✓ סודר בסיבובי מזרן — מנוחה בין קרבות');
  }catch(e){ console.error('spread:',e); toast('⚠ שגיאה בסידור'); }
}

function buildAllMatches(){
  if(!confirm('לבנות קרבות לכל הקטגוריות?\n\nקטגוריות שכבר יש להן קרבות יידלגו (התוצאות נשמרות).')) return;
  location.href='bracket.html?buildall=1';
}

async function loadRealMatches(){
  const compId=localStorage.getItem('judo_active_comp');
  if(!compId){ document.getElementById('h-title').textContent='שליטה — דמו'; render(); return; }

  try{
    const cats=await DB.getCategories(compId);
    if(!cats||!cats.length){ render(); return; }

    // Competition record → tatami_count (source of truth, not localStorage)
    let compName='תחרות', tCount=0;
    try{
      const comps=await DB.getCompetitions();
      const comp=comps?.find(c=>c.id===compId);
      if(comp){ compName=comp.name||compName; tCount=+comp.tatami_count||0; }
    }catch(e){ console.warn('comp fetch:',e); }
    if(!tCount) tCount=+(JSON.parse(localStorage.getItem('judo_config')||'{}').tatami_count)||3;

    // Collect all matches with their resolved tatami
    const flat=[];
    let maxT=tCount;
    for(const cat of cats){
      const catTat=Number(cat.tatami_id)||null;
      const matches=(cat.matches||[]);

      // Feeder map: for each match, which match feeds its blue/white slot, and with whom (winner/loser)
      // A match m with w_to_match=X, w_to_side='blue' means: winner of m → blue slot of X.
      const feed={}; // targetMatchNum → { blue:{role,ref}, white:{role,ref} }
      matches.forEach(src=>{
        if(src.w_to_match){ (feed[src.w_to_match]||(feed[src.w_to_match]={}))[src.w_to_side||'blue']={role:'winner',ref:src.match_num}; }
        if(src.l_to_match){ (feed[src.l_to_match]||(feed[src.l_to_match]={}))[src.l_to_side||'blue']={role:'loser',ref:src.match_num}; }
      });

      matches.sort((a,b)=>(a.order_in_tatami??999)-(b.order_in_tatami??999)||(a.match_num||0)-(b.match_num||0));
      matches.forEach(m=>{
        if(m.win_reason==='bye') return;
        const tid=Number(m.tatami_id)||catTat||1;
        if(tid>maxT) maxT=tid;
        const bName=cat.competitors?.find(c=>c.id===m.blue_id)?.name||null;
        const wName=cat.competitors?.find(c=>c.id===m.white_id)?.name||null;

        // Where an unknown slot will come from (winner/loser of another match)
        const f=feed[m.match_num]||{};
        const bRole=!bName?(f.blue?.role||null):null;
        const bRef =!bName?(f.blue?.ref ||null):null;
        const wRole=!wName?(f.white?.role||null):null;
        const wRef =!wName?(f.white?.ref ||null):null;
        // match_nums of the matches that feed this one (for round packing of future matches)
        const _feeders=[f.blue?.ref, f.white?.ref].filter(x=>x!=null);

        // Skip only truly empty matches that have no source either (nothing to show)
        if(!bName&&!wName&&!bRef&&!wRef&&m.status==='pending') return;

        flat.push({tid, row:{
          id:m.id, dbId:m.id,
          blue:bName, white:wName,
          bRole,bRef,wRole,wRef,_feeders,
          future: (!bName||!wName),
          category:cat.name, catId:cat.id, catTatami:catTat,
          stage:m.stage||'קרב',
          matchNum:m.match_num,
          order:m.order_in_tatami??999,
          status:m.status||'pending',
          susp:m.susp||null,
          winnerName: m.status==='done'?(m.winner_id===m.blue_id?bName:wName):null,
          winReason: m.win_reason||null,
        }});
      });
    }

    STATE.tatami=[];
    for(let i=1;i<=maxT;i++) STATE.tatami.push({id:i,matches:[]});
    flat.forEach(f=>{
      const t=STATE.tatami.find(x=>x.id===f.tid);
      if(t) t.matches.push(f.row);
    });
    // keep queue order stable inside each tatami
    STATE.tatami.forEach(t=>t.matches.sort((a,b)=>(a.order??999)-(b.order??999)||(a.matchNum||0)-(b.matchNum||0)));

    STATE.allCats=cats.map(c=>({
      id:c.id, name:c.name, tatami:Number(c.tatami_id)||null,
      method:c.method||'knockout',
      competitors:(c.competitors||[]).map(cp=>({id:cp.id,name:cp.name,club:cp.club||''})),
      matches:(c.matches||[]),
    }));
    document.getElementById('h-title').textContent=`שליטה — ${compName}`;
    render();
  }catch(e){
    console.error('control load error:',e);
    document.getElementById('h-title').textContent='שליטה — שגיאת חיבור';
    render();
  }
}

// Initial load — and auto-spread if we just came from "build all"
(async function(){
  await loadRealMatches();
  const qp=new URLSearchParams(location.search);
  if(qp.get('spread')==='1'){
    // clean the flag so a refresh doesn't re-run it
    history.replaceState(null,'',location.pathname);
    try{
      for(const t of STATE.tatami){ await autoSpreadTatami(t, true); }
      render();
      toast('✓ הקרבות סודרו אוטומטית בסיבובי מזרן');
    }catch(e){ console.error('auto-spread:',e); }
  }
})();
